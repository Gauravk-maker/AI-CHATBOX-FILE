<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartChat AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SCREEN (login / signup) -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1 class="brand">SmartChat <span>AI</span></h1>
      <p class="subtitle">Your personal AI assistant</p>

      <div id="auth-error" class="auth-error"></div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Log In</button>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <input type="text" id="signup-username" placeholder="Choose a username" autocomplete="username" required>
        <input type="password" id="signup-password" placeholder="Choose a password (min 6 chars)" autocomplete="new-password" required>
        <button type="submit">Sign Up</button>
      </form>

      <p class="toggle-text">
        <span id="show-signup">New here? <a href="#">Create an account</a></span>
        <span id="show-login" class="hidden">Already have an account? <a href="#">Log in</a></span>
      </p>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="chat-screen hidden">
    <header class="chat-header">
      <h2>SmartChat AI</h2>
      <div class="header-actions">
        <span id="welcome-user"></span>
        <button id="clear-btn" title="Clear chat history">Clear</button>
        <button id="logout-btn" title="Log out">Log Out</button>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <form id="chat-form" class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

<script src="script.js"></script>
</body>
</html>
